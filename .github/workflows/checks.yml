name: Checks

# Runs on every push and PR. Every job below is a merge/release gate: a red
# check means the change does not ship. (2026-08: baseline established in
# Phase 1, before any feature code.)
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Draft release tag for isolated installer verification"
        required: false
        type: string

# Least privilege: this workflow only runs checks, it never writes.
permissions:
  contents: read

jobs:
  checks:
    if: ${{ !inputs.release_tag }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Release verification regression tests
        run: node --test scripts/release-verification.test.mjs

      - name: Release tag and cleanup safety tests
        run: ./scripts/test-release-safety.ps1

      - name: Inventory sorting and date regression tests
        run: node --test scripts/inventory.test.mjs

      - name: Accent contrast
        run: npm run check:contrast

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Frontend build
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  installers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag }}
    # GitHub exposes draft releases only to callers with repository write
    # access. Scope this permission to the manually dispatched installer job;
    # ordinary push and pull-request checks remain read-only.
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        format: [nsis, msi]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify signed installers and upgrade from 0.11.3
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_FORMAT: ${{ matrix.format }}
        run: ./scripts/verify-installers.ps1
