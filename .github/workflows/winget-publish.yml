name: Publish to winget

# Every release so far has been submitted to winget by hand: fetch the last
# manifest as a template, edit the version/URL/hash, open a PR. That is how
# a URL pointing at the un-dotted asset name slipped into 0.8.0's PR (GitHub
# renames spaces to dots in release asset filenames, the manifest still had
# spaces) — a manual step run under time pressure is a manual step that
# gets skipped or rushed. This generates the manifest and opens the PR
# itself, from the release that is already signed and published, so there
# is nothing left to transcribe.
#
# "released" rather than "published": winget-releaser's own recommendation,
# and it excludes pre-releases specifically — a beta build has no business
# reaching winget's index.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (defaults to latest)"
        required: false

# The job never pushes to this repository — only to a fork of winget-pkgs,
# authenticated by the PAT in WINGET_TOKEN below, which is a separate
# credential from anything GITHUB_TOKEN could grant here.
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify downloaded installers before distribution
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: ./scripts/verify-published-release.ps1 -Tag $env:RELEASE_TAG

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Same shape as the Discord announcement workflow: a missing secret
      # skips the job with a visible warning rather than failing the run
      # red. The PAT is a personal credential tied to a GitHub account, not
      # something that can be generated from inside a workflow.
      #
      # The same gate covers the other reason there is nothing to do:
      # winget-releaser only ever *updates* a package, and exits 1 when the
      # identifier is absent from winget-pkgs. Until the first new-package
      # pull request is merged by a moderator, that is the guaranteed
      # outcome of every release here - a red run for an expected state,
      # which is how a red run stops meaning anything.
      - name: Check the PAT and that the package is in the index
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_TOKEN secret is not set; skipping the winget submission"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            INDEX="https://api.github.com/repos/microsoft/winget-pkgs/contents"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$INDEX/manifests/a/AurelioAvila/PCTweakerUninstaller")
            if [ "$CODE" = "404" ]; then
              echo "::warning::AurelioAvila.PCTweakerUninstaller is not in winget-pkgs yet, so there is no version to update. The new-package pull request must be merged by a moderator first; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ "$CODE" = "200" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Could not verify the WinGet index (HTTP $CODE)"
              exit 1
            fi
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: AurelioAvila.PCTweakerUninstaller
          # Each release ships both an NSIS setup and an MSI of the same
          # x64 build. The default pattern matches both and would list one
          # architecture twice; the setup is the installer people expect
          # from winget, so it is the only one submitted.
          installers-regex: '_x64-setup\.exe$'
          # Use the exact tag resolved and checked by the Windows job.
          # A manual run without an input resolves latest there only once.
          release-tag: ${{ needs.verify.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
